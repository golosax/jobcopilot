<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}JobCopilot{% endblock %}</title>
  <style>
    :root {
      --bg:#faf9f5; --panel:#ffffff; --ink:#2b2a27; --muted:#75726b;
      --line:#e8e4da; --accent:#c96442; --accent-ink:#ffffff;
      --soft:#f3f0e9; --good:#4a7c59; --danger:#b4472f; --radius:14px;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
      font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    header { background:var(--panel); border-bottom:1px solid var(--line);
      padding:14px 26px; display:flex; align-items:center; gap:26px; position:sticky; top:0; z-index:5; }
    header .brand { font-weight:650; font-size:16px; letter-spacing:.2px; display:flex; align-items:center; gap:9px; }
    header .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); display:inline-block; }
    nav a { color:var(--muted); margin-right:18px; font-weight:500; font-size:14px; }
    nav a:hover { color:var(--ink); text-decoration:none; }
    main { max-width:960px; margin:26px auto; padding:0 22px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
      padding:22px; margin-bottom:18px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
    .card h2 { margin:0 0 4px; font-size:16px; font-weight:650; }
    .card .sub { color:var(--muted); font-size:13px; margin:0 0 14px; }
    label { display:block; margin:14px 0 5px; font-weight:550; font-size:13px; }
    label.check { display:flex; align-items:center; gap:8px; cursor:pointer; }
    label.check input[type=checkbox], label.check input[type=radio] { width:16px; height:16px; margin:0; flex-shrink:0; }
    .hint { color:var(--muted); font-size:12px; margin-top:4px; }
    input[type=text], input[type=number], input[type=url], input[type=email], textarea, select {
      width:100%; background:#fff; color:var(--ink); border:1px solid var(--line);
      border-radius:10px; padding:10px 12px; font:inherit; transition:border-color .15s, box-shadow .15s; }
    input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(201,100,66,.12); }
    textarea { resize:vertical; min-height:74px; font-family:ui-monospace,Menlo,monospace; font-size:12.5px; line-height:1.5; }
    .row { display:flex; gap:16px; flex-wrap:wrap; }
    .row > div { flex:1; min-width:150px; }
    button, .btn { background:var(--accent); color:var(--accent-ink); border:0; border-radius:10px;
      padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; transition:filter .15s; }
    button:hover { filter:brightness(1.05); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    button.secondary { background:var(--soft); color:var(--ink); border:1px solid var(--line); }
    button.danger { background:#fff; color:var(--danger); border:1px solid #e6c9bf; }
    button.danger:hover { background:#fbeee9; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; font-size:14px; }
    th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
    tr:last-child td { border-bottom:0; }
    pre { background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:13px;
      overflow:auto; max-height:300px; white-space:pre-wrap; font-size:12.5px; margin:0; }
    .pill { display:inline-block; padding:2px 10px; border-radius:20px; background:var(--soft);
      color:var(--muted); font-size:12px; font-weight:600; }
    .pill.good { background:#e8f1ea; color:var(--good); }
    .pill.live { background:#fbe9e3; color:var(--accent); }
    .actions { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .save-bar { position:sticky; bottom:0; padding:14px 0; }
  </style>
</head>
<body>
  <header>
    <span class="brand"><span class="dot"></span> JobCopilot</span>
    <nav>
      <a href="{{ url_for('index') }}">Config</a>
      <a href="{{ url_for('matches') }}">Matches</a>
      <a href="{{ url_for('visited') }}">Visited</a>
    </nav>
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
