{% extends "base.html" %}
{% block title %}{{ title }} · JobCopilot{% endblock %}
{% block body %}
<style>
  .reader { max-width:1024px; margin:0 auto; }
  .filename { color:var(--muted); font-size:13px; margin:0 0 18px; }
  .filename a { color:var(--muted); }
  .paper { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:40px 48px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
  .text { font-size:18px; line-height:1.75; white-space:pre-wrap; }
  @media (max-width:600px) { .paper { padding:26px 22px; } }
</style>
<div class="reader">
  <p class="filename"><a href="{{ back_url }}">← back to {{ back_label|default('matches') }}</a> &nbsp;·&nbsp; {{ title }}</p>
  <div class="paper">
    <div class="text">{{ text }}</div>
  </div>
</div>
{% endblock %}
