<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · JobCopilot</title>
  <style>
    :root {
      --bg:#faf9f5; --panel:#ffffff; --ink:#2b2a27; --muted:#75726b;
      --line:#e8e4da; --accent:#c96442; --radius:14px;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
      font:16px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    main { max-width:1024px; margin:48px auto; padding:0 22px; }
    .filename { color:var(--muted); font-size:13px; margin:0 0 18px; }
    .filename a { color:var(--muted); }
    .paper { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
      padding:40px 48px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
    .text { font-size:18px; line-height:1.75; white-space:pre-wrap; }
    @media (max-width:600px) { .paper { padding:26px 22px; } }
  </style>
</head>
<body>
  <main>
    <p class="filename"><a href="{{ back_url }}">← back to {{ back_label|default('matches') }}</a> &nbsp;·&nbsp; {{ title }}</p>
    <div class="paper">
      <div class="text">{{ text }}</div>
      {% if edit_field %}<form method="post" action="{{ url_for('edit_match') }}">
        <input type="hidden" name="url" value="{{ edit_url }}"><input type="hidden" name="field" value="{{ edit_field }}">
        <p><label for="value">Edit text</label></p><textarea id="value" name="value" style="width:100%;min-height:180px">{{ text }}</textarea>
        <p><button type="submit">Save</button></p>
      </form>{% endif %}
    </div>
  </main>
</body>
</html>
